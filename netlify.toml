[build]
  command = "python scripts/pack_netlify.py --widget analisis-seleccion --widget reportes_rt --widget procesador_excel --widget selector-imagenes-drone --widget carga-kml-sias"
  publish = "public"

[[headers]]
  for = "/exb/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
